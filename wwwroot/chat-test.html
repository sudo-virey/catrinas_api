<!DOCTYPE html>
<html>
<head>
    <title>Chat Test - WebSocket</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        input, button { margin: 5px; padding: 5px; }
        .message { margin: 5px 0; }
        .system { color: #888; font-style: italic; }
        .user { color: #007cba; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🚀 Test WebSocket - Chat Grupal</h1>
    <div>
        <strong>Estado:</strong> <span id="status">Desconectado</span>
    </div>
    
    <div style="margin: 10px 0; padding: 10px; border: 1px solid #ddd; background-color: #f9f9f9;">
        <strong>🔐 Autenticación JWT:</strong><br>
        <input type="password" id="jwtInput" placeholder="Ingresa tu token JWT aquí..." style="width: 500px; margin: 5px 0;" />
        <button onclick="obtenerJwtPrueba()" style="margin-left: 10px; background-color: #4CAF50; color: white; border: none; padding: 5px 10px; cursor: pointer;">🔑 Obtener JWT de Prueba</button>
        <br><small style="color: #666;">Necesitas un JWT válido para conectarte al chat. Usa el botón para generar uno de prueba.</small>
    </div>
    
    <div id="messages"></div>
    
    <div>
        <input type="text" id="userInput" placeholder="Tu nombre" value="Usuario" />
        <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." />
        <button onclick="sendMessage()">Enviar</button>
        <button onclick="connect()">Conectar</button>
        <button onclick="disconnect()">Desconectar</button>
    </div>

    <script src="https://unpkg.com/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>
    <script>
        let connection = null;
        const status = document.getElementById('status');
        const messages = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const messageInput = document.getElementById('messageInput');
        const jwtInput = document.getElementById('jwtInput');

        // Configurar la URL base según el entorno
        const baseUrl = window.location.origin;
        const pathBase = window.location.pathname.split('/').slice(0, -1).join('/'); // Obtiene /API_PRUEBA
        const hubUrl = baseUrl + pathBase + '/chatHub';

        function addMessage(message, className = '') {
            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.innerHTML = message;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function connect() {
            const jwtToken = jwtInput.value.trim();
            
            if (!jwtToken) {
                addMessage('🔴 Error: Debes ingresar un token JWT para conectarte', 'system');
                status.textContent = 'Error: JWT requerido ❌';
                status.style.color = 'red';
                return;
            }

            connection = new signalR.HubConnectionBuilder()
                .withUrl(hubUrl, {
                    accessTokenFactory: () => jwtToken
                })
                .build();

            connection.start().then(function () {
                status.textContent = 'Conectado ✅';
                status.style.color = 'green';
                addMessage('🟢 Conectado al chat con autenticación JWT', 'system');
            }).catch(function (err) {
                status.textContent = 'Error de conexión ❌';
                status.style.color = 'red';
                addMessage('🔴 Error: ' + err.toString(), 'system');
                addMessage('🔴 Verifica que tu JWT sea válido y no haya expirado', 'system');
            });

            // Escuchar mensajes
            connection.on('ReceiveMessage', function (user, message) {
                addMessage(`<span class="user">${user}:</span> ${message}`);
            });

            // Escuchar conexiones
            connection.on('UserConnected', function (connectionId) {
                addMessage(`👋 Usuario conectado (ID: ${connectionId.substring(0, 8)}...)`, 'system');
            });

            // Escuchar desconexiones
            connection.on('UserDisconnected', function (connectionId) {
                addMessage(`👋 Usuario desconectado (ID: ${connectionId.substring(0, 8)}...)`, 'system');
            });
        }

        function disconnect() {
            if (connection) {
                connection.stop();
                status.textContent = 'Desconectado';
                status.style.color = 'red';
                addMessage('🔴 Desconectado del chat', 'system');
            }
        }

        function sendMessage() {
            const user = userInput.value;
            const message = messageInput.value;
            
            if (connection && message) {
                connection.invoke('SendMessage', user, message).catch(function (err) {
                    addMessage('🔴 Error enviando mensaje: ' + err.toString(), 'system');
                });
                messageInput.value = '';
            }
        }

        // Enviar con Enter
        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Función para obtener JWT de prueba
        async function obtenerJwtPrueba() {
            try {
                addMessage('🔄 Solicitando JWT de prueba...', 'system');
                
                const response = await fetch(baseUrl + pathBase + '/api/test-jwt');
                const data = await response.json();
                
                if (response.ok && data.token) {
                    jwtInput.value = data.token;
                    addMessage('✅ JWT de prueba obtenido exitosamente', 'system');
                    addMessage(`👤 Usuario: ${data.usuario} | ⏰ Expira: ${new Date(data.expira).toLocaleString()}`, 'system');
                } else {
                    addMessage('❌ Error obteniendo JWT: ' + (data.error || 'Error desconocido'), 'system');
                }
            } catch (error) {
                addMessage('❌ Error de conexión al obtener JWT: ' + error.message, 'system');
            }
        }

        // Auto-conectar al cargar
        window.onload = function() {
            addMessage('🔵 Página cargada. Usa el botón "Obtener JWT de Prueba" y luego "Conectar".', 'system');
        };
    </script>
</body>
</html>
